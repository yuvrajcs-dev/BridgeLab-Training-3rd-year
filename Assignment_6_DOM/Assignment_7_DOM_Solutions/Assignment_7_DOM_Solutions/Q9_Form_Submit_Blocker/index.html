<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Form Validation</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><h1>Form Validation</h1><form id="registrationForm" novalidate>
<div class="field"><label for="name">Name</label><input id="name" name="name" type="text"><small class="error" id="nameError"></small></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="text"><small class="error" id="emailError"></small></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password"><small class="error" id="passwordError"></small></div>
<button type="submit">Submit</button></form><p id="successMessage" role="status"></p></main><script src="script.js"></script></body></html>
