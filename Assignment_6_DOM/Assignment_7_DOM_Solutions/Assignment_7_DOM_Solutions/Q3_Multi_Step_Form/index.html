<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Multi-Step Form</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><h1>Registration</h1><p id="stepLabel">Step 1 of 3</p><form id="multiStepForm" novalidate>
<section class="step active" data-step="0"><label for="name">Full name</label><input id="name" type="text" placeholder="Your name" required></section>
<section class="step" data-step="1"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required></section>
<section class="step" data-step="2"><label for="password">Password</label><input id="password" type="password" minlength="6" placeholder="At least 6 characters" required></section>
<p id="error" role="alert"></p><div class="actions"><button id="backButton" type="button" class="secondary" disabled>Back</button><button id="nextButton" type="button">Next</button></div></form><section id="summary" hidden></section></main><script src="script.js"></script></body></html>
