<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main class="gallery">

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1015/500/350"
                     alt="Mountain">
            </div>
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1016/500/350"
                     alt="Forest">
            </div>
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1018/500/350"
                     alt="Landscape">
            </div>
            <figcaption>Beautiful Landscape</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1025/500/350"
                     alt="Dog">
            </div>
            <figcaption>Friendly Dog</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1035/500/350"
                     alt="River">
            </div>
            <figcaption>River View</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1043/500/350"
                     alt="Ocean">
            </div>
            <figcaption>Ocean Scene</figcaption>
        </figure>

    </main>

</body>
</html>
