<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <h1>Tooltip Demonstration</h1>
        <p>Hover over the elements to see the tooltips.</p>

        <section class="tooltip-container">

            <div class="tooltip-item">
                ★
                <span class="tooltip">Favorite</span>
            </div>

            <div class="tooltip-item">
                ✉
                <span class="tooltip">Send Message</span>
            </div>

            <div class="tooltip-item">
                ⚙
                <span class="tooltip">Settings</span>
            </div>

            <div class="tooltip-item">
                ?
                <span class="tooltip">Help</span>
            </div>

            <div class="tooltip-item">
                Home
                <span class="tooltip">Go to Home</span>
            </div>

        </section>

    </main>

</body>
</html>
