<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Landing Page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Internal CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8f9fa;
        }

        .hero {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
        }

        .about {
            padding: 50px 20px;
            text-align: center;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 576px) {
            .hero h1 {
                font-size: 30px;
            }

            .hero {
                padding: 60px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MyCompany</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#home">Home</a>
                <a class="nav-link" href="#about">About</a>
                <a class="nav-link" href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <h1>Welcome to MyCompany</h1>
        <p>We provide the best solutions for your business.</p>
        <a href="#about" class="btn btn-light mt-3">Get Started</a>
    </section>

    <!-- About Section -->
    <section class="about container" id="about">
        <h2>About Us</h2>
        <p>We help businesses grow with modern technology.</p>
    </section>

    <!-- Contact Section -->
    <section class="container text-center py-4" id="contact">
        <h2>Contact Us</h2>
        <p>Email: contact@mycompany.com</p>
    </section>

    <!-- Footer -->
    <footer>
        <p class="mb-0">&copy; 2026 MyCompany. All rights reserved.</p>
    </footer>

</body>
</html>
