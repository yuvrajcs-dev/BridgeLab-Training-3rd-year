<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

            padding: 40px 20px;

            padding: 40px 20px;

            text-align: center;

        }

            .profile h1 {
                font-size: 28px;

        }

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My Portfolio</a>
        </div>
    </nav>

    <section class="profile">
        <img src="https://via.placeholder.com/140" alt="Profile Photo">
        <h1 class="mt-3">Yuvraj Singh</h1>

        <a href="#contact" class="btn btn-light">Hire Me</a>
