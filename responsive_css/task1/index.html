
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
        <p>Explore different CSS image filters</p>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <img class="blur" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500" alt="Mountain">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure>
                <img class="gray" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" alt="Nature">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" alt="Forest">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure>
                <img class="bright" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500" alt="Mountains">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=500" alt="Wildlife">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure>
                <img class="hue" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500" alt="Lake">
                <figcaption>Hue Rotate Filter</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Responsive Image Gallery</p>
    </footer>

</body>
</html>
