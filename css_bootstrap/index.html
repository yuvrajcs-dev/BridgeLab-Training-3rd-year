<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bootstrap Page</title>
    <link rel="stylesheet" href="./bootstrap-5.3.8-dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <!-- Hero Section -->
    <div class="container-fluid bg-warning p-5 text-primary w-100 vh-100 text-center d-flex justify-content-center align-items-center flex-column fs-1">
      <h1>My Bootstrap Page</h1>
      <p>This is a simple paragraph.</p>
      <i class="bi bi-house"></i>
      <i class="bi bi-house-add-fill"></i>
    </div>

    <!-- Grid Layout Section -->
    <div class="container">
      
      <!-- 3-6-3 Grid -->
      <div class="row mt-3">
        <div class="col-sm-3 bg-dark p-4 text-danger">
          <h1>Column1</h1>
        </div>
        <div class="col-sm-6 bg-warning p-4">
          <h1>Column2</h1>
        </div>
        <div class="col-sm-3 bg-primary p-4">
          <h1>Column3</h1>
        </div>
      </div>
      
      <!-- 6-3-3 Grid -->
      <div class="row mt-3 border border-5 border-danger">
        <div class="col-lg-6 bg-dark p-4 text-danger">
          <h1>Column1</h1>
        </div>
        <div class="col-lg-3 bg-warning p-4">
          <h1>Column2</h1>
        </div>
        <div class="col-lg-3 bg-primary p-4">
          <h1>Column3</h1>
        </div>
      </div>
      
      <!-- 12-Column Grid -->
      <div class="row mt-3 mb-5">
        <!-- 12 individual col-lg-1 elements -->
        <div class="col-lg-1 bg-dark p-4 text-danger"><h1>C1</h1></div>
        <div class="col-lg-1 bg-warning p-4"><h1>C2</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C3</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C4</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C5</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C6</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C7</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C8</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C9</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C10</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C11</h1></div>
        <div class="col-lg-1 bg-primary p-4"><h1>C12</h1></div>
      </div>

      <button type="button" class="btn btn-primary">Primary Button</button>
      
    </div>

  </body>
</html>
